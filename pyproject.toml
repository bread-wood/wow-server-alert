[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wow-server-alert"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
wow-server-alert = "wow_server_alert.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_server_alert"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]
